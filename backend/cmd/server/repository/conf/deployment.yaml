server:
  hostname: "localhost"
  port: 8090

gate_client:
  scheme: "https"
  hostname: "localhost"
  port: 8090
  path: "/gate"

tls:
  min_version: "1.2"
  cert_file: "repository/resources/security/server.cert"
  key_file: "repository/resources/security/server.key"

database:
  config:
    type: "sqlite"
    sqlite:
      path: "repository/database/configdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime:
    type: "sqlite"
    sqlite:
      path: "repository/database/runtimedb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  user:
    type: "sqlite"
    sqlite:
      path: "repository/database/userdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

crypto:
  encryption:
    key: "file://repository/resources/security/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "repository/resources/security/signing.cert"
      key_file: "repository/resources/security/signing.key"

jwt:
    preferred_key_id: "default-key"

cors:
  allowed_origins:
    - "https://localhost:3000"
    - "https://localhost:5190"
    - "https://localhost:5191"
    # - regex: '^https://[a-z0-9-]+\.staging\.example\.com(:[0-9]+)?$'

passkey:
  allowed_origins:
    - "https://localhost:8090"

consent:
  enabled: true
  base_url: "http://localhost:9090/api/v1"

entity_provider:
  type: "default"

authn_provider:
  type: "sunbird"
  sunbirdrc:
    search_url: "https://registry.released.mosip.net/api/v1/Insurance/search"
    entity_url: "https://registry.released.mosip.net/api/v1/Insurance"
    id_field: "policyNumber"
    entity_id_field: "osid"
    timeout: 10
    field_details: |
      [
        {"id": "policyNumber", "type": "text",  "format": ""},
        {"id": "fullName",     "type": "text",  "format": ""},
        {"id": "dob",          "type": "date",  "format": "dd/mm/yyyy"}
      ]
    claims_mapping: |
      {"name": "fullName", "email": "email", "phone_number": "mobile", "gender": "gender", "birthdate": "dob"}
